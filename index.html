  <!-- Webfonts. preconnect opens the TCP+TLS connection early so the font
       request does not wait for DNS; display=swap paints text immediately in
       the fallback font instead of leaving a blank page. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Order matters: tokens declare the variables that base.css consumes. -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
</head>

<body>
  <!-- Lets a keyboard user jump past the nav. First focusable thing on the
       page by convention. -->
  <a class="skip-link visually-hidden" href="#main">Skip to content</a>

        <a href="cv.html">CV</a>

      </div>
    </section>

  <footer class="site-footer">

</body>
